[package]
name = "my-copilot-desktop"
version = "0.1.0"
description = "A local-first coding agent desktop application"
edition = "2021"

[lib]
name = "my_copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
my-copilot-agent = { path = "../../../agent/rust" }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
# time 0.3.52 changed a parsing API still used by cookie 0.18.1.
time = "=0.3.51"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
